name: Build

on: [push, pull_request]

env:
  VK_SDK: '1.4.357.0'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (MSVC 2022)
            os: windows-latest
            generator: "Ninja"
            use_msvc: true
            use_mingw: false

          - name: Windows (MinGW)
            os: windows-latest
            generator: "Ninja"
            use_msvc: false
            use_mingw: true

          - name: Ubuntu (Linux)
            os: ubuntu-latest
            generator: "Ninja"
            use_msvc: false
            use_mingw: false

          - name: macOS
            os: macos-15
            generator: "Ninja"
            use_msvc: false
            use_mingw: false

    steps:
      # Checkout
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # System dependencies for Linux
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get --yes install libvulkan-dev libasound2-dev libx11-dev libxcursor-dev ninja-build gdb

      # Set up MinGW Toolchain on Windows if needed
      - name: Set up MinGW
        if: matrix.use_mingw
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      # Install VulkanSDK
      - name: Install VulkanSDK (Linux/Windows)
        if: runner.os != 'macOS'
        shell: pwsh
        run: |
          if ("${{ runner.os }}" -eq "Windows") {
            Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$env:VK_SDK/windows/vulkansdk-windows-X64-$env:VK_SDK.exe" -OutFile VulkanSDK.exe
            ./VulkanSDK.exe --accept-licenses --default-answer --confirm-command install 1>$null
            echo "VULKAN_SDK=C:/VulkanSDK/$env:VK_SDK" >> $env:GITHUB_ENV
            }
          elseif ("${{ runner.os }}" -eq "Linux") {
            Invoke-WebRequest -Uri https://sdk.lunarg.com/sdk/download/$env:VK_SDK/linux/vulkansdk-linux-x86_64-$env:VK_SDK.tar.xz -OutFile VulkanSDK.tar.xz
            mkdir VulkanSDK
            tar -xJf VulkanSDK.tar.xz -C ./VulkanSDK

            # Correctly assign the environment variables for the current PowerShell step execution context
            $env:VULKAN_SDK      = "${{ github.workspace }}/VulkanSDK/${{ env.VK_SDK }}/x86_64"
            $env:VK_LAYER_PATH   = "$env:VULKAN_SDK/etc/vulkan/explicit_layers.d"
            $env:LD_LIBRARY_PATH = "$env:VULKAN_SDK/lib"

            # Persist them into the global GITHUB_ENV file so future workflow steps can read them too
            echo "VULKAN_SDK=$env:VULKAN_SDK" >> $env:GITHUB_ENV
            echo "VK_LAYER_PATH=$env:VK_LAYER_PATH" >> $env:GITHUB_ENV
            echo "LD_LIBRARY_PATH=$env:LD_LIBRARY_PATH" >> $env:GITHUB_ENV
            }

      # Install glslang compiler
      - name: Install glslang (Linux/Windows)
        if: runner.os != 'macOS'
        shell: pwsh
        run: |
          mkdir glslang
          cd glslang
          if ("${{ runner.os }}" -eq "Windows") {
            Invoke-WebRequest -Uri https://github.com/KhronosGroup/glslang/releases/download/master-tot/glslang-master-windows-x64-Release.zip -OutFile glslang-master.zip
            }
          elseif ("${{ runner.os }}" -eq "Linux") {
            Invoke-WebRequest -Uri https://github.com/KhronosGroup/glslang/releases/download/master-tot/glslang-master-linux-Release.zip -OutFile glslang-master.zip
            }
          Expand-Archive -Path glslang-master.zip -DestinationPath ./
          cd ../
          echo "${{ github.workspace }}/glslang/bin" >> $env:GITHUB_PATH

      - name: Install glslang (macOS)
        if: runner.os == 'macOS'
        run: brew install glslang ninja

      # Set up MSVC environment variables
      - name: Set up MSVC Developer Command Prompt
        if: matrix.use_msvc
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Configure and Build Project
      - name: Configure and Build
        run: |
          cmake --version
          ninja --version

          cmake -HTests/tests -Bbuild -G "${{ matrix.generator }}" -DCMAKE_BUILD_TYPE:STRING=RelWithDebInfo -DCMAKE_SH=CMAKE_SH-NOTFOUND
          cmake --build build --target TempestTests

      # Run Test Suite
      - name: Run Tests (Windows - MSVC)
        if: matrix.use_msvc
        shell: pwsh
        run: |
          $env:PATH = "$env:VULKAN_SDK/Bin;" + $env:PATH
          cd build/testsuite
          ./TempestTests.exe

      - name: Run Tests (Windows - MinGW)
        if: matrix.use_mingw
        shell: pwsh
        run: |
          $env:PATH = "$env:VULKAN_SDK/Bin;" + $env:PATH
          cd build/testsuite
          gdb -batch -ex "run" -ex "bt" -ex "quit \$_exitcode" --args ./TempestTests.exe

      - name: Run Tests (Linux)
        if: runner.os == 'Linux'
        run: |
          cd build/testsuite
          gdb -batch -ex "run" -ex "bt" -ex "quit \$_exitcode" ./TempestTests

      - name: Run Tests (macOS)
        if: runner.os == 'macOS'
        run: |
          cd build/testsuite
          lldb -o run -o bt -o quit -- ./TempestTests
